<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travorium - Travorium Registration</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:0;
}

.container{
    max-width:450px;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#0066cc;
}

h2{
    text-align:center;
    color:#333;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#004c99;
}

.payment{
    margin-top:20px;
    padding:15px;
    background:#eef6ff;
    border-radius:8px;
    text-align:center;
}

.payment h3{
    color:#0066cc;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#777;
}
</style>

</head>
<body>

<div class="container">

<h2>Travorium Registration Form</h2>

<form>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="tel" placeholder="Phone Number" required>

<input type="text" placeholder="Country" required>

<button type="submit">Register</button>

</form>

<div class="payment">

<h3>Payment Information</h3>

<p><strong>Registration Fee:</strong> 61,000 RWF</p>

<p><strong>MTN MoMo Code:</strong> *182*8*1*2160613#</p>

<p><strong>Account Name:</strong> Patrick</p>

<p>Please complete the payment after registration.</p>

</div>

<div class="footer">
© 2026 vision - Travorium
</div>

</div>

</body>
</html>
